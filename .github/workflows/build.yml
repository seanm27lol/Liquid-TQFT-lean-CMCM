name: Build Lean 4
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Install elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> $GITHUB_PATH
    - run: lean --version
    - uses: actions/cache@v4
      with:
        path: |
          ~/.elan/toolchains
          .lake
        key: lake-${{ hashFiles('lake-manifest.json') }}
    - run: lake exe cache get
    - name: Build finite-products proof
      shell: bash
      run: |
        set +e
        lake build RequestProject.FiniteProducts > finite-products.log 2>&1
        status=$?
        cat finite-products.log
        exit $status
    - name: Upload compiler log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: finite-products-log
        path: finite-products.log
