name: Apply remaining audit corrections

on:
  pull_request:
    branches:
      - agent/correct-math-claims

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correct-math-claims
          fetch-depth: 0
      - name: Correct source and documentation claims
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, required: bool = False) -> None:
              p = Path(path)
              text = p.read_text()
              if required and old not in text:
                  raise SystemExit(f"Required text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          # BanachEmbedding: correct notation and scalar-linearity scope.
          replace("RequestProject/BanachEmbedding.lean", "c₀(ℕ, ℤ)", "c₀₀(ℕ, ℤ)")
          replace(
              "RequestProject/BanachEmbedding.lean",
              "**Fullness holds for normed spaces over ℝ (or any nontrivially normed field)**: in that setting,\ncontinuous additive maps are automatically ℝ-linear (by continuity + Cauchy's functional\nequation) and hence bounded (by `SemilinearMapClass.bound_of_continuous`).\n\nA corrected version would restrict the functor to a full subcategory of normed ℝ-vector spaces\n(or Banach spaces), which requires defining `NormedSpaceCat` - not currently available in Mathlib.",
              "Over real normed spaces, the immediate pointwise obstruction disappears because continuous\nadditive maps are real-linear and bounded. This does not by itself prove categorical fullness.\nFor complex or general valued fields, `CondensedAb` forgets scalar linearity; complex conjugation\nis already a continuous additive but non-complex-linear map. A scalar-sensitive target such as\ncondensed modules is required for a genuinely linear fully faithful embedding.",
              required=True,
          )
          replace(
              "RequestProject/BanachEmbedding.lean",
              "  Fullness holds when restricted to normed spaces over a nontrivially normed field.",
              "  Over ℝ the immediate boundedness obstruction disappears, but categorical fullness is not proved;\n  over ℂ and general fields a target retaining scalar linearity is required.",
              required=True,
          )
          replace(
              "RequestProject/BanachEmbedding.lean",
              "- `NormedSpaceCat` as full subcategory of `SemiNormedGrp` (to recover fullness)",
              "- Scalar-sensitive normed-space and condensed-module categories for a correctly stated fullness problem",
              required=True,
          )
          replace(
              "RequestProject/BanachEmbedding.lean",
              "which is needed\nfor the TQFT transfer theorem in `LiquidTQFT.lean`.",
              "which would be needed to apply the abstract braided-monoidal transfer construction\nin `LiquidTQFT.lean`.",
          )

          # Cob2: retain identifiers, but accurately describe the incomplete presentation.
          replace(
              "RequestProject/Cob2.lean",
              "# Combinatorial 2d Cobordism Category and Commutative Frobenius Algebras\n\nThis file defines:\n1. `CommFrobeniusObj` - a commutative Frobenius algebra object in a\n   symmetric monoidal category, the algebraic content of 2Cob.\n2. `Cob2Mor` - the free morphisms of the 2d cobordism category.\n3. `Cob2` - the 2d cobordism category as a quotient by Frobenius relations.\n4. The trivial Frobenius algebra on the unit object (proved).\n5. Connection to the AbstractTQFT framework from LiquidTQFT.lean.\n\n## Mathematical Background\n\nThe 2d oriented cobordism category 2Cob is the free symmetric monoidal\ncategory generated by a commutative Frobenius algebra. Its objects are\nnatural numbers (n copies of S¹) and morphisms are (equivalence classes of)\n2d cobordisms between them.\n\nA 2d TQFT valued in a symmetric monoidal category C is exactly a\ncommutative Frobenius algebra object in C.",
              "# A Frobenius Presentation Inspired by 2d Cobordisms\n\nThis file defines commutative Frobenius algebra data, raw generator syntax,\nand an ordinary quotient category on natural-number objects. The identifiers\nretain the historical `Cob2` name, but the current construction is not yet the\n2-dimensional bordism category as a symmetric monoidal category.\n\n## Mathematical Background and Scope\n\nClassically, the oriented 2-dimensional bordism category is the free symmetric\nmonoidal category generated by a commutative Frobenius algebra. Establishing\nthat result here would require a monoidal category instance, tensor interchange,\nsymmetric coherence, and a free universal property. None of those is proved in\nthis file. The current development formalizes useful algebraic data and an\nordinary presentation category related to that theorem.",
              required=True,
          )
          replace(
              "RequestProject/Cob2.lean",
              "packaged as a single structure. This is the algebraic content of a 2d TQFT:\na 2d TQFT valued in C is exactly a CommFrobeniusData in C.",
              "packaged as a single structure. This is the algebraic datum appearing in the\nclassical classification of 2d oriented TQFTs; that classification is not proved here.",
              required=True,
          )
          replace(
              "RequestProject/Cob2.lean",
              "structure, corresponding to the \"trivial\" 2d TQFT (Z(S¹) = 𝟙).",
              "structure. Under the classical classification, this datum corresponds to the\ntrivial 2d TQFT; the correspondence itself is not constructed here.",
          )
          replace(
              "RequestProject/Cob2.lean",
              "algebra structure, corresponding to the \"trivial\" 2d TQFT. -/",
              "algebra structure. -/",
          )
          replace(
              "RequestProject/Cob2.lean",
              "/-! ## Part 4: Generators and Relations for 2Cob\n\nWe define the 2d cobordism category combinatorially. Objects are natural\nnumbers (n copies of S¹). Morphisms are generated by the four basic\ncobordisms (μ, η, δ, ε) together with identity, composition, and\nmonoidal product, subject to the Frobenius relations.\n-/",
              "/-! ## Part 4: A Frobenius generators-and-relations presentation\n\nObjects are natural numbers. Raw morphisms are generated by the four Frobenius\noperations together with identity, composition, a formal tensor constructor,\nand swaps. The quotient below produces an ordinary category. A monoidal or\nsymmetric category structure and completeness for geometric cobordisms are not\nyet established.\n-/",
              required=True,
          )
          replace(
              "RequestProject/Cob2.lean",
              "/-- Raw morphisms in the 2d cobordism category, freely generated by\nthe four basic cobordisms and closed under composition and tensor product. -/",
              "/-- Raw syntax generated by the four Frobenius operations and closed under\nformal composition, tensor, and swap constructors. -/",
              required=True,
          )
          replace(
              "RequestProject/Cob2.lean",
              "axioms. Two raw morphisms are related iff they represent the same cobordism.",
              "axioms. No theorem proves that this relation is complete for geometric\n2-dimensional cobordisms.",
              required=True,
          )
          replace(
              "RequestProject/Cob2.lean",
              "/-- The 2d cobordism category. Objects are natural numbers (n copies of S¹).\nMorphisms are equivalence classes of cobordism words modulo Frobenius relations. -/",
              "/-- The ordinary category underlying the current Frobenius presentation.\nIt is not yet equipped with the monoidal and symmetric instances required of `2Cob`. -/",
              required=True,
          )
          replace(
              "RequestProject/Cob2.lean",
              "/-- Notation for the 2d cobordism category. -/",
              "/-- Historical notation for the ordinary Frobenius presentation category. -/",
              required=True,
          )
          replace(
              "RequestProject/Cob2.lean",
              "/-! ## Part 5: Connection to AbstractTQFT\n\nWe replicate the AbstractTQFT structure here to keep this file self-contained.\nThe transfer theorem applies to any braided monoidal source category.\n-/\n\n/-- An abstract TQFT: a braided monoidal functor Z : S ⥤ C. -/",
              "/-! ## Part 5: Abstract braided-monoidal scaffolding\n\nThis duplicates the abstract structure from `LiquidTQFT.lean`. It is not a\nstandard 2d TQFT definition because the source is arbitrary and braided rather\nthan an actual symmetric monoidal bordism category.\n-/\n\n/-- An abstract braided monoidal theory `Z : S ⥤ C`. -/",
              required=True,
          )
          replace(
              "RequestProject/Cob2.lean",
              "/-- Transfer theorem for 2d TQFTs: composing with a braided monoidal\nfunctor F : C → D yields a new TQFT. -/",
              "/-- Composition with a braided monoidal functor preserves this abstract\nbraided-monoidal theory structure. -/",
              required=True,
          )
          replace(
              "RequestProject/Cob2.lean",
              "/-! ## Part 6: The Classification Theorem (Statement)\n\nThe classification theorem for 2d TQFTs states: giving a symmetric\nmonoidal functor Z : 2Cob → C is equivalent to giving a commutative\nFrobenius algebra object in C.\n\nWe state the Frobenius → TQFT direction: a commutative Frobenius\nalgebra determines a functor from Cob2Cat.\n-/",
              "/-! ## Part 6: An unfinished ordinary functor\n\nThe classical classification theorem concerns symmetric monoidal functors from\nthe genuine category `2Cob`. The current source has no monoidal or symmetric\ninstance, so the unfinished definition below would construct only an ordinary\nfunctor from the presentation category.\n-/",
              required=True,
          )
          replace(
              "RequestProject/Cob2.lean",
              "/-- Given a commutative Frobenius algebra in C, we can define a functor\nfrom the cobordism category to C. This is the content of the classification\ntheorem: every commutative Frobenius algebra gives rise to a 2d TQFT.\n\nThe functor sends n ↦ X^⊗n and generators to the structure maps.\nThe Frobenius relations ensure well-definedness on the quotient. -/",
              "/-- Intended ordinary functor from the Frobenius presentation category.\nThe object assignment sends `n` to `X^⊗n`; the morphism action and functoriality\nproofs remain placeholders. Even when completed, symmetric monoidality and the\nclassification universal property would still require separate proofs. -/",
              required=True,
          )
          replace("RequestProject/Cob2.lean", "6. ✅ `Cob2Mor` - free morphisms of 2Cob (generators)", "6. ✅ `Cob2Mor` - raw Frobenius generator syntax")
          replace("RequestProject/Cob2.lean", "7. ✅ `Cob2Rel` - Frobenius relations as an inductive relation", "7. ✅ `Cob2Rel` - selected Frobenius and category relations")
          replace("RequestProject/Cob2.lean", "8. ✅ `Cob2Hom` - morphisms of 2Cob as quotient", "8. ✅ `Cob2Hom` - quotient morphisms of the presentation")
          replace("RequestProject/Cob2.lean", "9. ✅ `Cob2Category` - Category instance on ℕ (2d cobordism category)", "9. ✅ `Cob2Category` - ordinary `Category ℕ` instance; no monoidal structure")
          replace("RequestProject/Cob2.lean", "10. ✅ `TQFT2d` - 2d TQFTs as braided monoidal functors", "10. ✅ `TQFT2d` - abstract braided monoidal theory data")
          replace("RequestProject/Cob2.lean", "11. ✅ `TQFT2d.transfer` - transfer theorem for 2d TQFTs", "11. ✅ `TQFT2d.transfer` - composition of braided monoidal functors")
          replace(
              "RequestProject/Cob2.lean",
              "- `CommFrobeniusData.toCob2Functor` - the classification theorem direction\n  (Frobenius algebra → TQFT functor) requires detailed case analysis on\n  the quotient and well-definedness from the Frobenius relations",
              "- `CommFrobeniusData.toCob2Functor` - an unfinished ordinary functor;\n  completing it would not yet establish symmetric monoidality or the classification theorem",
              required=True,
          )
          replace(
              "RequestProject/Cob2.lean",
              "- A braided monoidal functor F : C → CondensedAb transfers any\n  2d TQFT valued in C to one valued in CondensedAb",
              "- A braided monoidal functor `F : C → CondensedAb` transfers the abstract\n  braided-monoidal structure; applying this to a genuine TQFT requires further constructions",
              required=True,
          )

          # Public HTML proposal: remove the strongest overclaims.
          proposal = Path("docs/proposal.html")
          if proposal.exists():
              t = proposal.read_text()
              replacements = {
                  "A Formally Verified Categorical Foundation": "A Lean-Checked Exploratory Formalization",
                  "The standard target, topological vector spaces, fails to be abelian, breaking the homological algebra required for TQFT gluing. Condensed abelian groups fix this: they form an abelian category with an exact completed tensor product.": "Topological vector spaces can be poorly behaved for homological and analytic constructions. Condensed abelian groups provide an abelian symmetric monoidal setting, but ordinary TQFT gluing itself is functorial composition and does not require exact sequences. This repository proves no general tensor-exactness theorem.",
                  "The central result -- that condensed abelian groups form a symmetric monoidal category -- is proved <em>without any sorries or custom axioms</em>.": "The project machine-checks an instantiation of Mathlib's existing symmetric monoidal structure on condensed abelian groups. Five <code>sorry</code> placeholders remain elsewhere in the project.",
                  "Exact sequences break. Derived functors misbehave. The gluing axiom becomes ill-defined. The completed tensor product compounds this: it is not exact.": "This obstructs naive homological algebra and can complicate particular infinite-dimensional constructions. It does not make ordinary functorial TQFT gluing ill-defined.",
                  "This is precisely the property TopVect lacks and TQFT gluing requires.": "Such exactness can be valuable in additional derived or analytic constructions, but it is not an axiom of ordinary TQFT and is not proved here.",
                  "<tr><td>2d cobordism category (Cob2)</td><td><span class=\"b g\">Verified</span></td><td>Quotient of free morphisms</td></tr>": "<tr><td>Frobenius presentation category</td><td><span class=\"b y\">Partial</span></td><td>Ordinary category only; no symmetric monoidal structure</td></tr>",
                  "The formal verification is evidence that the condensed TQFT direction is mathematically sound, precisely scoped, and ready for deeper development.": "The verified declarations provide useful categorical groundwork, while the geometric TQFT, tensor-exactness, and symmetric cobordism claims remain future work.",
              }
              for a, b in replacements.items():
                  t = t.replace(a, b)
              t = t.replace("c&#8320;(&#8469;,&#8484;)", "c<sub>00</sub>(&#8469;,&#8484;)")
              t = t.replace("Fullness holds when restricted to normed spaces over a nontrivially normed field (&#8477; or &#8450;).", "Over &#8477; the immediate boundedness obstruction disappears; over &#8450;, <code>CondensedAb</code> forgets complex linearity, so a scalar-sensitive target is required.")
              proposal.write_text(t)

          # Progress report: make current limitations visible.
          progress = Path("docs/progress_report.html")
          if progress.exists():
              t = progress.read_text()
              t = t.replace("All results are formally verified in Lean 4 against Mathlib, assisted by Harmonic's Aristotle system.", "Sorry-free declarations are machine-checked against Mathlib; five placeholders remain and are listed below.")
              t = t.replace("Gluing structure from exactness", "Short-exact-sequence component lemma")
              t = t.replace("Counterexample: summation on c&#8320;(&#8469;,&#8484;) is continuous and additive but not bounded.", "Counterexample: summation on c<sub>00</sub>(&#8469;,&#8484;) is continuous and additive but not bounded.")
              t = t.replace("Fullness holds for NormedSpace over &#8477; or &#8450;.", "The immediate obstruction disappears over &#8477;; over &#8450; a target retaining scalar linearity is required.")
              t = t.replace("<tr><td><code>Cob2Category : Category &#8469;</code></td><td><span class=\"b g\">Sorry-free</span></td></tr>", "<tr><td><code>Cob2Category : Category &#8469;</code></td><td><span class=\"b y\">Ordinary category only</span></td></tr>")
              t = t.replace("<h3>2. No prior bridge: normed spaces to condensed math</h3>", "<h3>2. A bridge in the pinned Mathlib version</h3>")
              t = t.replace("The embedding functor is the first.", "The project did not find an existing packaged construction in Mathlib v4.28.0; no global priority claim is made.")
              t = t.replace("<h3>5. Frobenius algebras formalize cleanly</h3>", "<h3>5. Frobenius algebra data formalizes cleanly</h3>")
              t = t.replace("<p><strong>2.1</strong> NormedSpaceCat R and fully faithful embedding.</p>", "<p><strong>2.1</strong> Scalar-sensitive normed-space and condensed-module categories; prove any fullness claim with explicit scalar hypotheses.</p>")
              progress.write_text(t)

          # Paper source: add the same scope corrections.
          tex = Path("liquid_tqft.tex")
          if tex.exists():
              t = tex.read_text()
              t = t.replace("A Formally Verified Foundation", "A Lean-Checked Exploratory Foundation")
              t = t.replace("and the TQFT gluing axiom (which decomposes state spaces via exact sequences when cutting manifolds) becomes ill-defined.", "and naive homological or analytic constructions may fail. Ordinary TQFT gluing, however, is functorial composition and does not itself require exact sequences.")
              t = t.replace("The exactness of this tensor product is precisely the property $\\TopVect$ lacks and TQFT gluing requires.", "Special liquid exactness results may support additional derived or analytic constructions. They are not axioms of ordinary TQFT and are not proved in this repository.")
              t = t.replace("This is strictly more general than Atiyah's original symmetric formulation and covers non-symmetric examples relevant to 3-dimensional TQFTs", "This is reusable braided monoidal scaffolding rather than Atiyah's symmetric TQFT definition; an actual bordism source and symmetric compatibility remain to be formalized")
              t = t.replace("short exact sequences provide the decomposition structure needed for TQFT gluing.", "short exact sequences provide mono, epi, and exactness data. This is additional categorical structure, not ordinary TQFT gluing.")
              t = t.replace("Fullness is recovered by restricting to $\\mathrm{NormedSpace}\\;R$ for~$R$ a nontrivially normed field.", "Over real normed spaces the immediate boundedness obstruction disappears, but categorical fullness still needs proof. Over complex or general fields, $\\CondAb$ forgets scalar linearity, so a condensed-module target is required.")
              t = t.replace("The 2-dimensional cobordism category $\\mathrm{Cob}_2$ is defined as a category", "An ordinary Frobenius presentation category is defined")
              t = t.replace("$\\mathrm{Cob}_2$ category & Cob2.lean & Sorry-free", "Frobenius presentation category (ordinary only) & Cob2.lean & Sorry-free")
              t = t.replace("The classification ``2d TQFT = commutative Frobenius algebra''", "The commutative Frobenius algebra data used in the classical classification")
              t = t.replace("Define $\\mathrm{NormedSpaceCat}\\;R$ and prove fullness (which holds for normed spaces over valued fields)", "Define scalar-sensitive normed-space and condensed-module categories and state a correctly hypothesized fullness problem")
              t = t.replace("the commutative Frobenius algebra structure classifying 2d TQFTs", "commutative Frobenius algebra data relevant to the classical 2d classification")
              tex.write_text(t)

          # This workflow is one-time machinery and should not remain in the PR.
          Path(".github/workflows/lean-diagnostic.yml").unlink()
          PY
      - name: Commit and push corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Correct remaining mathematical claims"
          git push origin HEAD:agent/correct-math-claims
