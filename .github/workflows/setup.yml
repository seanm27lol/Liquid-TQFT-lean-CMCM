name: Setup repo
on:
  workflow_dispatch:
jobs:
  reorganize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Move files
      run: |
        mkdir -p RequestProject docs
        for f in BanachEmbedding.lean Cob2.lean CondensedMonoidal.lean LiquidTQFT.lean MonoidalViaLocalization.lean; do
          [ -f "$f" ] && git mv "$f" "RequestProject/$f"
        done
        for f in proposal.html progress_report.html mathflowchart.html; do
          [ -f "$f" ] && git mv "$f" "docs/$f"
        done
    - name: Commit
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add -A
        git commit -m "Move Lean files to RequestProject/, HTML to docs/"
        git push
