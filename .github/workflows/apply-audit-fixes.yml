This document separates mathematical background, machine-checked declarations,
and research goals. It is the authoritative scope statement for the repository.

## What Lean currently verifies

1. **Symmetric monoidal condensed abelian groups.** The repository instantiates
   existing Mathlib localization machinery to obtain monoidal, braided, and
   symmetric instances on `CondensedAb`. The underlying implementation and
   mathematics are due to Riou and Asgeirsson.
2. **Braided monoidal transfer.** Composition with a braided monoidal functor
   preserves the repository's abstract braided monoidal theory structure.
3. **A condensed realization functor.** A seminormed abelian group `V` is sent to
   the sheaf `S ↦ C(S,V)`, and bounded homomorphisms act by postcomposition.
4. **Faithfulness and non-fullness.** Evaluation on the one-point compact space
   proves faithfulness. Summation on finitely supported integer sequences with
   the sup norm is continuous but unbounded, producing a condensed morphism that
   cannot come from `SemiNormedGrp`; hence the sheaf-level functor is not full.
5. **Finite products in `SemiNormedGrp`.** Finite Pi types with the sup norm give
   categorical products.
6. **Frobenius algebra data.** The algebraic operations and relations of a
   commutative Frobenius object are packaged, and the tensor unit supplies a
   trivial example.

## What the project does not yet verify

### A geometric TQFT

An Atiyah-Segal TQFT is a symmetric monoidal functor from a geometric bordism
category. `AbstractTQFT` presently accepts an arbitrary braided monoidal source,
so it should be read as reusable categorical scaffolding, not as a completed
formalization of a TQFT.

### TQFT gluing from exact sequences

Ordinary gluing is composition in the bordism category, while disjoint union is
the monoidal product. Short exact sequences are not part of those axioms. They
may become important in derived, homological, factorization, or analytic models,
but such a model and its hypotheses must be stated separately.

### Tensor exactness or the Liquid Tensor Experiment

The existence of a symmetric monoidal tensor product on `CondensedAb` does not
imply exactness in either variable. The repository does not port or reprove the
Liquid Tensor Experiment, and it should not describe LTE as an unrestricted
exactness theorem for all condensed abelian groups.

### The actual category `2Cob`

`Cob2Category` is an ordinary quotient category generated by selected syntax and
relations. It lacks a proved monoidal category instance, symmetric coherence,
interchange laws, a completeness theorem identifying morphisms with geometric
cobordisms, and the free symmetric monoidal universal property. Completing the
ordinary `toCob2Functor` definition would not by itself prove the classification
of 2d TQFTs.

### Full scalar-linear embeddings

`CondensedAb` remembers only additive structure. For complex spaces, complex
conjugation is continuous and additive but not complex-linear, so a complex
normed-space category cannot embed fully into `CondensedAb`. A future linear
formalization should target condensed or liquid modules over the scalar ring.
For real normed spaces the immediate additive-versus-bounded obstruction
vanishes, but categorical fullness still requires a separate proof.

## Placeholders and trust boundary

The repository contains 5 `sorry` placeholders:

- `semiNormedGrpToCondensedAb_preservesEqualizers`;
- `semiNormedGrpToCondensedAb_preservesFiniteProducts`;
- the `map`, `map_id`, and `map_comp` fields of
  `CommFrobeniusData.toCob2Functor`.

There are no explicit custom `axiom` declarations. Nevertheless, declarations
that depend on `sorry` are not fully verified and must not be described as
sorry-free merely because their own source line contains no placeholder.

## Defensible next steps

1. Remove the two finite-limit preservation placeholders with explicit pointwise
   comparison isomorphisms.
2. Build a genuine strict monoidal presentation category, proving tensor
   interchange, associativity, units, symmetry, and congruence.
3. State and prove its universal property for commutative Frobenius objects.
4. Define scalar-sensitive condensed-module targets before pursuing real or
   complex Banach-space fullness.
5. State a specific derived or analytic field-theory construction before asking
   for tensor exactness; avoid treating exactness as an axiom of ordinary TQFT.
''')

