          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
''')

          # Remove the one-time patch machinery from the resulting branch.
          Path(".audit-trigger").unlink(missing_ok=True)
          Path(".github/workflows/apply-audit-fixes.yml").unlink(missing_ok=True)
          PY
      - name: Commit audit fixes
