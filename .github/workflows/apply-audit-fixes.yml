              t = t.replace("The classification ``2d TQFT = commutative Frobenius algebra''", "The commutative Frobenius algebra data used in the classical classification")
              t = t.replace("Define $\\mathrm{NormedSpaceCat}\\;R$ and prove fullness (which holds for normed spaces over valued fields)", "Define scalar-sensitive normed-space and condensed-module categories and state a correctly hypothesized fullness problem")
              t = t.replace("the commutative Frobenius algebra structure classifying 2d TQFTs", "commutative Frobenius algebra data relevant to the classical 2d classification")
              t = t.replace("The complete Lean~4 formalization", "The current Lean~4 project")
              tex.write_text(t)

          # Permanent CI for all future pull requests.
          Path(".github/workflows/lean.yml").write_text(r'''name: Lean build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Elan
