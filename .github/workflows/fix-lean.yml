name: Fix LiquidTQFT
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Fix orphaned docstrings
      run: |
        cd RequestProject
        sed -i '/^\/-- `CondensedAb` is an abelian/,/^-\/$/d' LiquidTQFT.lean
        sed -i '/^\/-- Every morphism in CondensedAb has a kernel/,/^-\/$/d' LiquidTQFT.lean
        sed -i '/^\/-- Every morphism in CondensedAb has a cokernel/,/^-\/$/d' LiquidTQFT.lean
        sed -i '/^\/-- CondensedAb has all finite limits/,/^-\/$/d' LiquidTQFT.lean
        sed -i '/^\/-- CondensedAb has all finite colimits/,/^-\/$/d' LiquidTQFT.lean
    - name: Commit
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add -A
        git diff --cached --quiet || git commit -m "Fix LiquidTQFT.lean: remove orphaned docstrings"
        git push
