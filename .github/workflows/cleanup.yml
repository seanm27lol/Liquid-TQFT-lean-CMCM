name: Cleanup repo
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Fix filenames and remove stale files
      run: |
        cd RequestProject

        # If clean-suffixed files exist, rename them to canonical names
        for f in "LiquidTQFT clean.lean" "MonoidalViaLocalization clean.lean" "CondensedMonoidal clean.lean"; do
          canonical=$(echo "$f" | sed 's/ clean//')
          if [ -f "$f" ]; then
            if [ -f "$canonical" ]; then
              git rm "$canonical"
            fi
            git mv "$f" "$canonical"
            echo "Renamed '$f' -> '$canonical'"
          fi
        done

        # Delete CondensedMonoidal.lean entirely (superseded)
        if [ -f "CondensedMonoidal.lean" ]; then
          git rm "CondensedMonoidal.lean"
          echo "Deleted CondensedMonoidal.lean (superseded by MonoidalViaLocalization.lean)"
        fi

        cd ..

        # Remove stale workflows
        for w in .github/workflows/fix-files.yml .github/workflows/fix-lean.yml .github/workflows/setup.yml; do
          if [ -f "$w" ]; then
            git rm "$w"
            echo "Deleted stale workflow $w"
          fi
        done

    - name: Update README
      run: |
        cat > README.md << 'EOF'
        # Liquid TQFT: Formally Verified Categorical Foundations

        A Lean 4 formalization investigating liquid vector spaces (Clausen-Scholze)
        as a target category for topological quantum field theories.

        ## Building

        ```
        lake exe cache get
        lake build
        ```

        Requires Lean 4 with Mathlib v4.28.0.

        ## Files

        | File | Content |
        |------|---------|
        | `LiquidTQFT.lean` | Abstract TQFT framework, transfer theorem, monoidal CondensedAb |
        | `MonoidalViaLocalization.lean` | Symmetric monoidal structure via localization (Riou-Asgeirsson) |
        | `BanachEmbedding.lean` | Embedding SemiNormedGrp -> CondensedAb, faithfulness, fullness disproof |
        | `Cob2.lean` | Commutative Frobenius algebras, 2d cobordism category |

        ## Status

        4 active files. 3 sorries (2 in BanachEmbedding, 1 in Cob2). 0 custom axioms.

        ## Key Results

        - `MonoidalCategory CondensedAb` (sorry-free, via `Sheaf.monoidalCategory`)
        - `AbstractTQFT.transfer` (sorry-free)
        - `semiNormedGrpToCondensedAb : SemiNormedGrp -> CondensedAb` (sorry-free)
        - `semiNormedGrpToCondensedAb_faithful` (sorry-free)
        - Fullness of embedding **disproved** for SemiNormedGrp (counterexample found)
        - `CommFrobeniusAlgebra` and `Cob2Category` (sorry-free)
        - `SemiNormedGrp.hasFiniteProducts` (sorry-free, new to Mathlib)

        ## Attribution

        The symmetric monoidal structure on CondensedAb relies entirely on Mathlib
        infrastructure built by Joel Riou and Dagur Asgeirsson.

        ## Citation

        ```
        Co-authored-by: Aristotle (Harmonic)
        ```

        Synthesis and prompt engineering by Claude (Anthropic).

        ## License

        MIT
        EOF
        # Remove leading whitespace from heredoc
        sed -i 's/^        //' README.md

    - name: Commit and push
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add -A
        git diff --cached --quiet || git commit -m "Cleanup: fix filenames, remove stale workflows and superseded files

        - Rename 'X clean.lean' files to canonical 'X.lean' names
        - Delete CondensedMonoidal.lean (superseded by MonoidalViaLocalization.lean)
        - Delete stale fix-files, fix-lean, setup workflows
        - Update README to match actual repo state"
        git push
