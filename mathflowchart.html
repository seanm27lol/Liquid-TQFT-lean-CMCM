function MathMap() {
  const svgRef = useRef(null);
  const [transform, setTransform] = useState({ x: -10, y: -200, scale: 0.58 });
  const [dragging, setDragging] = useState(false);
  const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState(null);
  const [showNew, setShowNew] = useState(true);
  const [showLemmas, setShowLemmas] = useState(true);
  const [showScholze, setShowScholze] = useState(true);
  const [showTentative, setShowTentative] = useState(true);
  const [searchTerm, setSearchTerm] = useState("");

  const nodeMap = useMemo(() => { const m = {}; nodes.forEach(n => { m[n.id] = n; }); return m; }, []);
  const handleWheel = useCallback((e) => {
    e.preventDefault();
    const d = e.deltaY > 0 ? 0.92 : 1.08;
    setTransform(t => {
      const ns = Math.max(0.12, Math.min(4, t.scale * d));
      const r = svgRef.current.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      return { scale: ns, x: mx - (mx - t.x) * (ns / t.scale), y: my - (my - t.y) * (ns / t.scale) };
    });
  }, []);
  useEffect(() => { const s = svgRef.current; if (s) { s.addEventListener('wheel', handleWheel, { passive: false }); return () => s.removeEventListener('wheel', handleWheel); }}, [handleWheel]);
  const md = (e) => { if (!e.target.closest('.ng')) { setDragging(true); setDragStart({ x: e.clientX - transform.x, y: e.clientY - transform.y }); }};
  const mm = (e) => { if (dragging) setTransform(t => ({ ...t, x: e.clientX - dragStart.x, y: e.clientY - dragStart.y })); };
  const mu = () => setDragging(false);
  const ts = (e) => { if (!e.target.closest('.ng') && e.touches.length === 1) { setDragging(true); setDragStart({ x: e.touches[0].clientX - transform.x, y: e.touches[0].clientY - transform.y }); }};
  const tmv = (e) => { if (dragging && e.touches.length === 1) setTransform(t => ({ ...t, x: e.touches[0].clientX - dragStart.x, y: e.touches[0].clientY - dragStart.y })); };
  const searchMatch = (n) => { if (!searchTerm) return true; const s = searchTerm.toLowerCase(); return n.label.toLowerCase().includes(s) || n.desc.toLowerCase().includes(s); };
  const isLemma = (n) => n.type === "lemma" || n.type === "theorem";
  const filteredNodes = nodes.filter(n => {
    if (!showNew && n.cat === "new") return false;
    if (!showLemmas && isLemma(n)) return false;
    if (!showScholze && n.cat === "scholze") return false;
    if (!showTentative && n.cat === "tentative") return false;
    if (filter && n.cat !== filter) return false;
    return true;
  });
  const filteredIds = new Set(filteredNodes.map(n => n.id));
  const filteredEdges = edges.filter(([a, b]) => filteredIds.has(a) && filteredIds.has(b));
  const connSet = useMemo(() => {
    if (!selected) return new Set();
    const s = new Set([selected]);
    edges.forEach(([a, b]) => { if (a === selected) s.add(b); if (b === selected) s.add(a); });
    return s;
  }, [selected]);
  const stats = useMemo(() => ({
    total: nodes.length, exp: nodes.filter(n => n.cat === "new").length,
    scholze: nodes.filter(n => n.cat === "scholze").length,
    tentative: nodes.filter(n => n.cat === "tentative").length,
    lemmas: nodes.filter(n => isLemma(n)).length, edges: edges.length
  }), []);

  const getNodeColor = (n) => {
    if (isLemma(n)) return "#ffd700";
    return CATEGORIES[n.cat]?.color || "#888";
  };

  return (
    <div style={{ width: "100%", height: "100vh", background: "#06060b", fontFamily: "'JetBrains Mono','SF Mono','Fira Code',monospace", display: "flex", flexDirection: "column", overflow: "hidden", color: "#ccc" }}>
      <div style={{ padding: "6px 10px", background: "#0a0a12", borderBottom: "1px solid #141420", display: "flex", flexWrap: "wrap", gap: "3px", alignItems: "center", zIndex: 10 }}>
        <span style={{ fontSize: 11, fontWeight: 800, color: "#fff", marginRight: 4, letterSpacing: 0.5 }}>MathFlowChart</span>
        <span style={{ fontSize: 7, color: "#333", padding: "1px 4px", border: "1px solid #181825", borderRadius: 3 }}>
          {stats.total} nodes · {stats.scholze} Scholze · {stats.exp} expanded · {stats.tentative} tentative · {stats.lemmas} lemmas · {stats.edges} edges
        </span>
        <div style={{ display: "flex", gap: 2, flexWrap: "wrap", marginLeft: 4 }}>
          {Object.entries(CATEGORIES).map(([k, { color: c, label }]) => (
            <button key={k} onClick={() => setFilter(f => f === k ? null : k)} style={{
              background: filter === k ? c + "20" : "transparent", border: `1px solid ${filter === k ? c : "#141420"}`,
              color: filter === k ? c : "#3a3a44", padding: "1px 4px", borderRadius: 2, fontSize: 7, cursor: "pointer", transition: "all .12s"
            }}>
              <span style={{ display: "inline-block", width: 4, height: 4, borderRadius: "50%", background: c, marginRight: 2, verticalAlign: "middle" }} />{label}
            </button>
          ))}
        </div>
        <input type="text" placeholder="search..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)}
          style={{ background: "#0a0a12", border: "1px solid #181825", color: "#888", padding: "1px 5px", borderRadius: 2, fontSize: 8, width: 90, outline: "none", marginLeft: 3 }} />
        {[["Expanded", showNew, setShowNew, "#1abc9c"], ["Scholze", showScholze, setShowScholze, "#ff6b9d"], ["Tentative", showTentative, setShowTentative, "#6b5b95"], ["Lemmas", showLemmas, setShowLemmas, "#ffd700"]].map(([l, v, f, c]) => (
          <label key={l} style={{ fontSize: 7, marginLeft: 2, display: "flex", alignItems: "center", gap: 2, cursor: "pointer" }}>
            <input type="checkbox" checked={v} onChange={() => f(!v)} style={{ accentColor: c, width: 9, height: 9 }} />
            <span style={{ color: c }}>{l}</span>
          </label>
        ))}
        <button onClick={() => setTransform({ x: -10, y: -200, scale: 0.58 })} style={{
          background: "transparent", border: "1px solid #141420", color: "#3a3a44", padding: "1px 4px", borderRadius: 2, fontSize: 7, cursor: "pointer", marginLeft: "auto"
        }}>Reset</button>
      </div>

      <div style={{ flex: 1, position: "relative", overflow: "hidden" }}>
        <svg ref={svgRef} width="100%" height="100%"
          onMouseDown={md} onMouseMove={mm} onMouseUp={mu} onMouseLeave={mu}
          onTouchStart={ts} onTouchMove={tmv} onTouchEnd={mu}
          style={{ cursor: dragging ? "grabbing" : "grab" }}>
          <defs>
            <filter id="gl"><feGaussianBlur stdDeviation="4" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
            <filter id="gs"><feGaussianBlur stdDeviation="2" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
            <filter id="pink"><feGaussianBlur stdDeviation="5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
          </defs>
          <g transform={`translate(${transform.x},${transform.y}) scale(${transform.scale})`}>
            {/* Region labels */}
            {[
              { t: "FOUNDATIONS", x: 280, y: 1550, c: "#e74c3c" },
              { t: "CATEGORICAL FOUNDATIONS", x: 460, y: 1620, c: "#1abc9c" },
              { t: "ALGEBRAIC STRUCTURES", x: 180, y: 1140, c: "#e67e22" },
              { t: "RING TOWER", x: 370, y: 1140, c: "#e67e22" },
              { t: "CLIFFORD · SPIN", x: 250, y: 580, c: "#1abc9c" },
              { t: "ANALYSIS TOWER", x: 720, y: 1160, c: "#2ecc71" },
              { t: "GEOMETRY", x: 1240, y: 1450, c: "#3498db" },
              { t: "TOPOLOGY", x: 1460, y: 1340, c: "#3498db" },
              { t: "ALGEBRAIC GEOMETRY", x: 1230, y: 880, c: "#3498db" },
              { t: "STACKS · ÉTALE · DERIVED", x: 1100, y: 740, c: "#1abc9c" },
              { t: "APPLIED", x: 1350, y: 540, c: "#9b59b6" },
              { t: "PHYSICS", x: 460, y: 440, c: "#f39c12" },
              { t: "SCHOLZE PROGRAM", x: 810, y: 470, c: "#ff6b9d" },
              { t: "CONDENSED · PERFECTOID · PRISMATIC", x: 810, y: 190, c: "#ff6b9d" },
              { t: "STRING THEORY MATHEMATICS", x: 630, y: -80, c: "#1abc9c" },
            ].map((r, i) => (
              <text key={i} x={r.x} y={r.y} textAnchor="middle" fill={r.c + "0e"} fontSize={11} fontWeight={900} letterSpacing="2px" style={{ pointerEvents: "none" }}>{r.t}</text>
            ))}

            {filteredEdges.map(([a, b], i) => {
              const na = nodeMap[a], nb = nodeMap[b];
              if (!na || !nb) return null;
              const isS = na.cat === "scholze" || nb.cat === "scholze";
              const isT = na.cat === "tentative" || nb.cat === "tentative";
              const isN = na.cat === "new" || nb.cat === "new";
              const isL = isLemma(na) || isLemma(nb);
              const hl = selected && connSet.has(a) && connSet.has(b);
              const dim = selected && !hl;
              const sDim = searchTerm && (!searchMatch(na) || !searchMatch(nb));
              return <line key={i} x1={na.x} y1={na.y} x2={nb.x} y2={nb.y}
                stroke={hl ? getNodeColor(nodeMap[selected]) : isT ? "#6b5b9518" : isS ? "#ff6b9d12" : isL ? "#ffd70010" : isN ? "#1abc9c10" : "#0e0e18"}
                strokeWidth={hl ? 1.8 : isT ? 0.5 : isS ? 0.6 : 0.4} strokeDasharray={isT ? "4,4" : isL ? "2,3" : isS ? "2,2" : isN ? "3,2" : "none"}
                opacity={dim ? 0.08 : sDim ? 0.04 : 1} style={{ transition: "all .2s" }} />;
            })}

            {filteredNodes.map(n => {
              const isSel = selected === n.id;
              const conn = connSet.has(n.id);
              const dim = selected && !conn;
              const isL = isLemma(n);
              const isS = n.cat === "scholze";
              const isT = n.cat === "tentative";
              const isN = n.cat === "new";
              const sHit = searchTerm && searchMatch(n);
              const sDim = searchTerm && !searchMatch(n);
              const col = getNodeColor(n);
              const w = isL ? 130 : isS ? 140 : isT ? 140 : 128;
              const h = isL ? 22 : isS ? 26 : isT ? 26 : 26;

              return (
                <g key={n.id} className="ng" onClick={() => setSelected(s => s === n.id ? null : n.id)} style={{ cursor: "pointer" }}>
                  <rect x={n.x - w/2} y={n.y - h/2} width={w} height={h} rx={isL ? 11 : isT ? 8 : isS ? 6 : 4}
                    fill={isSel ? col + "28" : isT ? "#0a0812" : isS ? "#0d0812" : "#0a0a10"}
                    stroke={isSel ? col : dim ? "#0a0a10" : sHit ? "#fff" : col + (isT ? "30" : isS ? "50" : isN ? "35" : "45")}
                    strokeWidth={isSel ? 2.2 : isT ? 0.8 : isS ? 1 : 0.7}
                    strokeDasharray={isT ? "5,3,2,3" : isL ? "4,2" : (isN && !isSel) ? "3,2" : "none"}
                    opacity={dim ? 0.12 : sDim ? 0.08 : isT ? 0.7 : 1}
                    style={{ transition: "all .2s", filter: isSel ? (isS ? "url(#pink)" : "url(#gl)") : sHit ? "url(#gs)" : "none" }} />
                  <text x={n.x} y={n.y + 3} textAnchor="middle"
                    fill={dim ? "#161620" : isSel ? "#fff" : sHit ? "#fff" : col}
                    fontSize={isL ? 7 : 7.5} fontFamily="inherit"
                    fontWeight={isSel ? 700 : (isL || isS) ? 600 : isT ? 500 : isN ? 500 : 400}
                    fontStyle={isL ? "italic" : isT ? "italic" : "normal"}
                    opacity={dim ? 0.15 : sDim ? 0.08 : isT ? 0.6 : 1}
                    style={{ transition: "all .2s", pointerEvents: "none" }}>
                    {n.label}
                  </text>
                  {isS && !dim && <circle cx={n.x + w/2 - 4} cy={n.y - h/2 + 4} r={2.5} fill="#ff6b9d" opacity={0.7} />}
                  {isT && !dim && <circle cx={n.x + w/2 - 4} cy={n.y - h/2 + 4} r={2.5} fill="#6b5b95" opacity={0.5} />}
                  {isN && !isL && !isS && !isT && !dim && <circle cx={n.x + w/2 - 4} cy={n.y - h/2 + 4} r={2} fill="#1abc9c" opacity={0.5} />}
                </g>
              );
            })}
          </g>
        </svg>

        {selected && nodeMap[selected] && (() => {
          const n = nodeMap[selected]; const isL = isLemma(n); const isS = n.cat === "scholze"; const isT = n.cat === "tentative";
          const col = getNodeColor(n); const cat = CATEGORIES[n.cat];
          const inc = edges.filter(([, b]) => b === selected).map(([a]) => nodeMap[a]).filter(Boolean);
          const out = edges.filter(([a]) => a === selected).map(([, b]) => nodeMap[b]).filter(Boolean);
          return (
            <div style={{
              position: "absolute", bottom: 8, left: 8, right: 8,
              background: isT ? "#0a0816ee" : isS ? "#0d081aee" : "#0a0a12ee", backdropFilter: "blur(14px)",
              border: `1px solid ${col}20`, borderRadius: 10, padding: "10px 14px",
              maxWidth: 620, zIndex: 20, boxShadow: `0 0 40px ${col}06`
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 5 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                  <span style={{ color: col, fontSize: 12, fontWeight: 700, fontStyle: (isL || isT) ? "italic" : "normal" }}>{n.label.replace("⟡ ", "")}</span>
                  {isL && <span style={{ fontSize: 6, color: "#ffd700", padding: "1px 3px", border: "1px solid #ffd70030", borderRadius: 2 }}>{n.type === "theorem" ? "THEOREM" : "LEMMA"}</span>}
                  {isS && <span style={{ fontSize: 6, color: "#ff6b9d", padding: "1px 3px", border: "1px solid #ff6b9d30", borderRadius: 2 }}>SCHOLZE</span>}
                  {isT && <span style={{ fontSize: 6, color: "#6b5b95", padding: "1px 3px", border: "1px solid #6b5b9530", borderRadius: 2 }}>CONTESTED</span>}
                  {n.cat === "new" && !isL && <span style={{ fontSize: 6, color: "#1abc9c", padding: "1px 3px", border: "1px solid #1abc9c30", borderRadius: 2 }}>EXPANDED</span>}
                </div>
                <span style={{ fontSize: 6, color: "#333", padding: "1px 3px", border: "1px solid #181825", borderRadius: 2 }}>{cat?.label}</span>
              </div>
              <p style={{ fontSize: 10, color: "#777", marginTop: 4, lineHeight: 1.6 }}>{n.desc}</p>
              <div style={{ fontSize: 7.5, color: "#2a2a35", marginTop: 5, lineHeight: 1.8 }}>
                {inc.length > 0 && <div><span style={{ color: "#3a3a44" }}>← from:</span> {inc.map(x => x.label.replace("⟡ ", "")).join(" · ")}</div>}
                {out.length > 0 && <div><span style={{ color: "#3a3a44" }}>→ to:</span> {out.map(x => x.label.replace("⟡ ", "")).join(" · ")}</div>}
              </div>
              <button onClick={() => setSelected(null)} style={{ position: "absolute", top: 6, right: 8, background: "transparent", border: "none", color: "#222", cursor: "pointer", fontSize: 13 }}>×</button>
            </div>
          );
        })()}
        <div style={{ position: "absolute", top: 5, right: 7, fontSize: 7, color: "#151520", lineHeight: 1.4, textAlign: "right" }}>
          scroll=zoom · drag=pan · click=inspect<br/>
          <span style={{ color: "#ff6b9d20" }}>● scholze</span> · <span style={{ color: "#1abc9c20" }}>● expanded</span> · <span style={{ color: "#6b5b9520" }}>● tentative</span> · <span style={{ color: "#ffd70020" }}>⟡ lemma</span>
        </div>
      </div>
    </div>
  );
